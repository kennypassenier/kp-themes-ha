Terminal:
  card-mod-theme: "Terminal"
  card-mod-root: |
    @media (prefers-reduced-motion: no-preference) {
      ha-card {
        transition: background-color 90ms steps(2, end), border-color 90ms steps(2, end);
      }
    }
  modes:
    dark:
      primary-color: "hsl(120, 90%, 50%)"
      accent-color: "hsl(65, 90%, 22%)"
      primary-background-color: "hsl(120, 10%, 5%)"
