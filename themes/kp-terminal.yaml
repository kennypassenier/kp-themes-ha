      card-background-color: "hsl(120, 9%, 7%)"
      primary-text-color: "hsl(120, 85%, 68%)"
      secondary-text-color: "hsl(120, 25%, 62%)"
      disabled-text-color: "hsl(120, 30%, 34%)"
      divider-color: "hsl(120, 20%, 18%)"
      error-color: "hsl(0, 90%, 62%)"
      warning-color: "hsl(65, 100%, 43%)"
      success-color: "hsl(120, 100%, 43%)"
      info-color: "hsl(150, 75%, 46%)"
      state-icon-color: "hsl(120, 25%, 62%)"
      state-icon-active-color: "hsl(120, 90%, 50%)"
      switch-checked-color: "hsl(120, 90%, 50%)"
      sidebar-background-color: "hsl(120, 12%, 3%)"
      sidebar-text-color: "hsl(120, 60%, 70%)"
      sidebar-icon-color: "hsl(120, 60%, 70%)"
      sidebar-selected-icon-color: "hsl(120, 90%, 50%)"
      sidebar-selected-text-color: "hsl(120, 90%, 50%)"
      app-header-background-color: "hsl(120, 9%, 7%)"
      app-header-text-color: "hsl(120, 85%, 68%)"
      table-row-background-color: "hsl(120, 9%, 7%)"
