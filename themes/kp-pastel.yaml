      card-background-color: "hsl(0, 0%, 100%)"
      primary-text-color: "hsl(285, 25%, 20%)"
      secondary-text-color: "hsl(285, 12%, 38%)"
      disabled-text-color: "hsl(300, 22%, 57%)"
      divider-color: "hsl(285, 25%, 87%)"
      error-color: "hsl(355, 65%, 44%)"
      warning-color: "hsl(35, 70%, 31%)"
      success-color: "hsl(150, 60%, 28%)"
      info-color: "hsl(255, 55%, 50%)"
      state-icon-color: "hsl(285, 12%, 38%)"
      state-icon-active-color: "hsl(330, 55%, 42%)"
      switch-checked-color: "hsl(330, 55%, 42%)"
      sidebar-background-color: "hsl(285, 35%, 94%)"
      sidebar-text-color: "hsl(285, 25%, 22%)"
      sidebar-icon-color: "hsl(285, 25%, 22%)"
      sidebar-selected-icon-color: "hsl(330, 55%, 42%)"
