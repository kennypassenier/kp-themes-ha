Pastel:
  card-mod-theme: "Pastel"
  card-mod-root: |
    @media (prefers-reduced-motion: no-preference) {
      ha-card {
        transition: background-color 220ms cubic-bezier(0.34, 1.56, 0.64, 1), border-color 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }
    }
  modes:
    light:
