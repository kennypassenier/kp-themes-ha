# Generated by gates/generate-ha-themes.mjs from themes/synthwave/tokens.json.
# Do not edit: `npm run gates` fails when this file and the token
# source disagree. Drop it in Home Assistant's themes/ directory.
Synthwave:
  card-mod-theme: "Synthwave"
  card-mod-root: |
    @media (prefers-reduced-motion: no-preference) {
      ha-card {
        transition: background-color 220ms cubic-bezier(0.2, 0.9, 0.2, 1), border-color 220ms cubic-bezier(0.2, 0.9, 0.2, 1);
      }
    }
    /* The horizon: the night sky above, the floor below, and the glow of
       the sun where they meet. Fixed, so it stays put while the dashboard
       scrolls over it — the way the register treats the hero. */
    hui-view, hui-sections-view, hui-masonry-view {
      position: relative;
    }
    hui-view::before, hui-sections-view::before, hui-masonry-view::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(
          60% 40% at 50% 62%,
          hsl(341 100% 64% / 0.22) 0%,
          transparent 70%
        ),
        linear-gradient(
          to bottom,
          hsl(263, 89%, 7%) 0%,
          hsl(263, 89%, 7%) 58%,
          hsl(300 45% 22% / 0.55) 62%,
          hsl(263, 89%, 7%) 100%
        );
    }
    /* The floor under the horizon: lines running to a vanishing point. */
    hui-view::after, hui-sections-view::after, hui-masonry-view::after {
      content: "";
      position: fixed;
      inset: 62% 0 0 0;
      pointer-events: none;
      z-index: 0;
      background: repeating-linear-gradient(
        to right,
        hsl(179 94% 59% / 0.14) 0 1px,
        transparent 1px 64px
      );
    }
  card-mod-card: |
    /* A card is a lit panel: a thin neon edge with a glow under it,
       rather than a border. */
    ha-card {
      position: relative;
      border: 1px solid hsl(300, 45%, 22%) !important;
      box-shadow:
        0 0 0 1px hsl(341 100% 64% / 0.18),
        0 8px 28px hsl(263 89% 7% / 0.75);
    }
    .card-header {
      font-family: 'KP Outrun Display', 'Orbitron', 'Audiowide', 'Eurostile', 'Arial Black', sans-serif;
      letter-spacing: 0.06em;
      color: hsl(260, 100%, 91%);
      text-shadow:
        0 0 6px hsl(341 100% 64% / 0.55),
        0 0 18px hsl(341 100% 64% / 0.25);
    }
  modes:
    dark:
      primary-color: "hsl(341, 100%, 64%)"
      accent-color: "hsl(341, 100%, 64%)"
      primary-background-color: "hsl(263, 89%, 7%)"
      secondary-background-color: "hsl(255, 22%, 14%)"
      card-background-color: "hsl(250, 20%, 17%)"
      primary-text-color: "hsl(260, 100%, 91%)"
      secondary-text-color: "hsl(253, 41%, 69%)"
      disabled-text-color: "hsl(313, 55%, 52%)"
      divider-color: "hsl(300, 45%, 22%)"
      error-color: "hsl(356, 99%, 63%)"
      warning-color: "hsl(48, 98%, 68%)"
      success-color: "hsl(153, 82%, 70%)"
      info-color: "hsl(179, 94%, 59%)"
      state-icon-color: "hsl(253, 41%, 69%)"
      state-icon-active-color: "hsl(341, 100%, 64%)"
      switch-checked-color: "hsl(341, 100%, 64%)"
      sidebar-background-color: "hsl(260, 87%, 4%)"
      sidebar-text-color: "hsl(260, 100%, 91%)"
      sidebar-icon-color: "hsl(260, 100%, 91%)"
      sidebar-selected-icon-color: "hsl(341, 100%, 64%)"
      sidebar-selected-text-color: "hsl(341, 100%, 64%)"
      app-header-background-color: "hsl(250, 20%, 17%)"
      app-header-text-color: "hsl(260, 100%, 91%)"
      table-row-background-color: "hsl(250, 20%, 17%)"
      table-row-alternative-background-color: "hsl(255, 22%, 14%)"
      ha-card-border-color: "hsl(300, 45%, 22%)"
      ha-card-border-radius: "2px"
      ha-card-border-width: "1px"
